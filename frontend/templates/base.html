<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Агрегатор учебных материалов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">EduAggregator</a>
        <div class="d-flex gap-2">
              <a href="{{ url_for('index') }}" type="button" class="btn btn-outline-success">Добавить</a>
              <a href="http://127.0.0.1:8000/docs" type="button" class="btn btn-outline-success">Swagger</a>
        </div>
      </div>
    </nav>

    <main class="container pd-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if message %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" role="alert">
                        {{ message }}
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
