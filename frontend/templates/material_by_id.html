{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h3>
            {{ 'Редактирование материала' if material else 'Добавление материала' }}
        </h3>
        <form method="post" class="row g-3">
          <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" class="form-control" name="title" required value="{{ material.title if material else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Ссылка</label>
            <input type="url" class="form-control" name="link" required value="{{ material.link if material else '' }}">
          </div>
          <div class="mb-3 form-check">
            <label class="form-label">Описание</label>
              <textarea class="form-control" name="description" rows="4">{{ material.description if material else '' }}</textarea>
          </div>
          <button type="submit" class="btn btn-primary">Добавить</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
